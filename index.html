<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点延迟看板</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0f1e;color:#e2e8f0}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 48px}
  header{padding:8px 2px 16px}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stat{background:linear-gradient(180deg,#141d33,#0f172a);border:1px solid #1e293b;border-radius:14px;padding:14px}
  .stat b{font-size:24px;display:block}
  .stat span{font-size:12px;color:#94a3b8}
  .stat small{font-size:12px;color:#94a3b8}
  .bar-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
  .filters select{flex:1;min-width:0}
  .chip{border:1px solid #334155;background:#111c33;color:#e2e8f0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
  .chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
  input,select{background:#111c33;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font-size:14px}
  input{flex:1;min-width:160px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr);gap:6px}.stat{padding:8px 6px}.stat b{font-size:18px}.stat span{font-size:11px}.upd-note{display:block}.head-row{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:nowrap}.theme{order:0;align-self:auto;margin-top:0}.theme label{display:none}h1{font-size:20px}.theme-btn{min-width:104px}.controls{flex-direction:column}.controls input{flex:none;width:100%;min-width:0}.controls select{flex:none;width:100%;min-width:0}.filters select{font-size:13px;padding:10px 6px}.meta{flex-wrap:nowrap}.meta span{white-space:nowrap}}
  .card{background:#111c33;border:1px solid #1e293b;border-radius:14px;padding:14px}
  .card.off{opacity:.65}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .top>div:first-child{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px}
  .meta{color:#94a3b8;font-size:12px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .st-on{color:#22c55e;font-weight:600}
  .st-mid{color:#eab308;font-weight:600}
  .st-bad{color:#ef4444;font-weight:600}
  .st-off{color:#94a3b8;font-weight:600}
  .loss{display:inline-block;min-width:62px}
  .bar-inline{flex:1;min-width:80px;height:6px;border-radius:999px;background:#1e293b;overflow:hidden}
  .bar-inline i{display:block;height:100%;border-radius:999px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;white-space:nowrap}
  .lat{font-size:22px;font-weight:800;white-space:nowrap;text-align:right;line-height:1}
  .lat small{font-size:13px;font-weight:400;color:#94a3b8}
  .good{color:#4ade80}.mid{color:#facc15}.bad{color:#f87171}.off{color:#94a3b8}
  .bar{height:8px;border-radius:999px;background:#1e293b;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px}
  .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#94a3b8}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .empty{color:#94a3b8;padding:28px;text-align:center;grid-column:1/-1}
  .theme{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .theme label{font-size:13px;color:#94a3b8}
  .theme select{padding:7px 10px;font-size:13px;min-width:120px;flex:0}
  .theme-drop{position:relative}
  .theme-btn{display:flex;align-items:center;gap:6px;background:#111c33;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;min-width:110px;justify-content:space-between}
  .theme-btn span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .theme-list{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#111c33;border:1px solid #334155;border-radius:12px;padding:4px;min-width:130px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .theme-list.open{display:block}
  .theme-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:#e2e8f0;border:none;border-radius:8px;padding:9px 10px;font-size:13px;cursor:pointer}
  .theme-opt:hover{background:#1e293b}
  .theme-opt.on{background:#2563eb;color:#fff}
  body.light .theme-btn,body.light .theme-list{background:#ffffff;color:#0f172a;border-color:#e2e8f0}
  body.light .theme-opt{color:#0f172a}
  body.light .theme-opt:hover{background:#f1f5f9}
  body.black .theme-btn,body.black .theme-list{background:#111111;border-color:#333333}
  .drop{position:relative;flex:1;min-width:0}
  .drop-btn{display:flex;align-items:center;gap:6px;width:100%;background:#111c33;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;justify-content:space-between;white-space:nowrap;overflow:hidden}
  .drop-btn span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .drop-btn span:last-child,.theme-btn span:last-child{flex:none}
  .drop-list{display:none;position:absolute;left:0;top:calc(100% + 6px);background:#111c33;border:1px solid #334155;border-radius:12px;padding:4px;min-width:100%;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .drop-list.open{display:block}
  .drop-opt{display:block;width:100%;text-align:left;background:transparent;color:#e2e8f0;border:none;border-radius:8px;padding:9px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .drop-opt:hover{background:#1e293b}
  .drop-opt.on{background:#2563eb;color:#fff}
  body.light .drop-btn,body.light .drop-list{background:#ffffff;color:#0f172a;border-color:#e2e8f0}
  body.light .drop-opt{color:#0f172a}
  body.light .drop-opt:hover{background:#f1f5f9}
  body.black .drop-btn,body.black .drop-list{background:#111111;border-color:#333333}
  body.light{background:#ffffff;color:#0f172a}
  body.light .sub,body.light .stat span{color:#64748b}
  body.light .stat{background:#f8fafc;border-color:#e2e8f0}
  body.light .chip,body.light input,body.light select,body.light .card{background:#ffffff;color:#0f172a;border-color:#e2e8f0}
  body.light .theme button{background:#f8fafc;color:#0f172a;border-color:#e2e8f0}
  body.light .theme label{color:#64748b}
  body.light .meta{color:#64748b}
  body.light .bar{background:#e2e8f0}
  body.light .pill{background:#f1f5f9;color:#334155}
  body.light .card.off{opacity:.6}
  body.black{background:#000000;color:#e2e8f0}
  body.black .stat,body.black .chip,body.black input,body.black select,body.black .card{background:#111111;border-color:#222222}
  body.black .theme button{background:#111111;border-color:#333333}
  body.black .bar{background:#222222}
  body.black .pill{background:#222222}
  .card{cursor:pointer}
  .detail{display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:10px}
  .detail.open{display:grid}
  .dbox{background:#f1f5f9;color:#0f172a;border-radius:12px;padding:12px}
  .dbox h3{margin:0 0 8px;font-size:14px;color:#334155}
  .drow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
  .drow .k{color:#334155}
  .drow .v{font-weight:700}
  .segs{display:flex;gap:2px;margin:2px 0 6px}
  .segs i{flex:1;height:6px;border-radius:2px;background:#e2e8f0}
  .hint{font-size:12px;color:#94a3b8;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1>节点延迟看板</h1>
        <div class="sub" id="updated">正在加载…</div>
      </div>
      <div class="theme">
        <label>主题背景</label>
        <div class="theme-drop">
          <button class="theme-btn" id="themeBtn" onclick="toggleThemeMenu(event)"><span id="themeLabel">⬛ 黑色主题</span><span>▾</span></button>
          <div class="theme-list" id="themeList">
            <button class="theme-opt" data-theme="black" onclick="pickTheme('black')">⬛ 黑色主题</button>
            <button class="theme-opt" data-theme="light" onclick="pickTheme('light')">☀️ 白色主题</button>
          </div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="total">-</b><span>全部节点</span></div>
      <div class="stat"><b id="online" style="color:#4ade80">-</b><span>在线节点</span></div>
      <div class="stat"><b id="offline" style="color:#94a3b8">-</b><span>离线节点</span></div>
      <div class="stat"><b id="avail">-</b><span>可用率</span></div>
    </div>
  </header>

  <div class="bar-top filters">
    <div class="drop">
      <button class="drop-btn" onclick="toggleDrop(event,'src')"><span id="srcLabel">全部机场</span><span>▾</span></button>
      <div class="drop-list" id="list-src"></div>
    </div>
    <div class="drop">
      <button class="drop-btn" onclick="toggleDrop(event,'only')"><span id="onlyLabel">全部状态</span><span>▾</span></button>
      <div class="drop-list" id="list-only">
        <button class="drop-opt" onclick="pickOnly('',this)">全部状态</button>
        <button class="drop-opt" onclick="pickOnly('online',this)">仅在线</button>
        <button class="drop-opt" onclick="pickOnly('offline',this)">仅离线</button>
      </div>
    </div>
    <div class="drop">
      <button class="drop-btn" onclick="toggleDrop(event,'sort')"><span id="sortLabel">延迟排序</span><span>▾</span></button>
      <div class="drop-list" id="list-sort">
        <button class="drop-opt" onclick="pickSort('lat',this)">延迟排序</button>
        <button class="drop-opt" onclick="pickSort('name',this)">名称排序</button>
      </div>
    </div>
  </div>
  <div class="bar-top controls">
    <input id="q" placeholder="搜索节点名 / 地区…" oninput="render()">
  </div>

  <div class="grid" id="list"></div>
  <p class="sub" style="margin-top:14px">每小时自动测一次 · 只确认节点是否在线 · 仅供参考</p>
</div>
<script>
let data={nodes:[]};
let curSrc='', curOnly='', curSort='lat';
function closeDrops(){document.querySelectorAll('.drop-list').forEach(l=>l.classList.remove('open'));}
function toggleDrop(e,name){e.stopPropagation();const l=document.getElementById('list-'+name);const was=l.classList.contains('open');closeDrops();if(!was) l.classList.add('open');}
function markOn(listId,el){document.querySelectorAll('#'+listId+' .drop-opt').forEach(b=>b.classList.remove('on'));if(el) el.classList.add('on');}
function pickSrc(s,el){curSrc=s;document.getElementById('srcLabel').textContent=s||'全部机场';markOn('list-src',el);closeDrops();render();}
function pickOnly(v,el){curOnly=v;document.getElementById('onlyLabel').textContent=el.textContent;markOn('list-only',el);closeDrops();render();}
function pickSort(v,el){curSort=v;document.getElementById('sortLabel').textContent=el.textContent;markOn('list-sort',el);closeDrops();render();}
function setTheme(t){
  document.body.classList.remove('light','black');
  if(t==='light') document.body.classList.add('light');
  if(t==='black') document.body.classList.add('black');
  try{localStorage.setItem('theme',t);}catch(e){}
  const label=document.getElementById('themeLabel');
  if(label) label.textContent=t==='light'?'☀️ 白色主题':'⬛ 黑色主题';
  document.querySelectorAll('.theme-opt').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));
}
function toggleThemeMenu(e){e.stopPropagation();document.getElementById('themeList').classList.toggle('open');}
function pickTheme(t){setTheme(t);document.getElementById('themeList').classList.remove('open');}
document.addEventListener('click',()=>{const l=document.getElementById('themeList');if(l) l.classList.remove('open');closeDrops();});
(function(){try{const t=localStorage.getItem('theme');setTheme(t==='light'?'light':'black');}catch(e){setTheme('black');}})();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const r=await fetch('results.json?'+Date.now());
  data=await r.json();
  document.getElementById('updated').innerHTML='更新时间：'+data.updated_at+'<span class="upd-note">（每小时自动测一次）</span>';
  document.getElementById('total').textContent=data.total;
  document.getElementById('online').textContent=data.online;
  document.getElementById('offline').textContent=data.offline;
  document.getElementById('avail').textContent=data.total?Math.round(data.online/data.total*100)+'%':'-';
  const srcs=[...new Set(data.nodes.map(n=>n.source).filter(Boolean))].sort((a,b)=>{
    const na=parseInt((a.match(/\d+/)||['0'])[0],10), nb=parseInt((b.match(/\d+/)||['0'])[0],10);
    return na!==nb?na-nb:a.localeCompare(b,'zh');
  });
  const sel=document.getElementById('list-src');
  sel.innerHTML=`<button class="drop-opt${curSrc===''?' on':''}" onclick="pickSrc('',this)">全部机场</button>`+srcs.map(s=>`<button class="drop-opt${curSrc===s?' on':''}" onclick="pickSrc('${esc(s)}',this)">${esc(s)}</button>`).join('');
  document.getElementById('srcLabel').textContent=curSrc||'全部机场';
  render();
}
function setSrc(s){curSrc=s;render();}
function cls(ms,online){
  if(!online) return 'off';
  if(ms<200) return 'good'; if(ms<400) return 'mid'; return 'bad';
}
function barColor(ms,online){
  if(!online) return '#475569';
  if(ms<200) return '#22c55e'; if(ms<400) return '#eab308'; return '#ef4444';
}
function segs(filled,color){
  let s='';
  for(let i=0;i<20;i++) s+=`<i style="${i<filled?`background:${color}`:''}"></i>`;
  return `<div class="segs">${s}</div>`;
}
function detailHtml(n){
  const c=cls(n.latency_ms,n.online);
  const latColor=n.online?(n.latency_ms<200?'#16a34a':n.latency_ms<400?'#ca8a04':'#dc2626'):'#94a3b8';
  const latFill=n.online?Math.min(20,Math.max(1,Math.round((n.latency_ms||0)/500*20))):20;
  const lossFill=Math.round((n.loss||0)/100*20);
  const lossColor=n.loss===0?'#16a34a':n.loss<50?'#ca8a04':'#dc2626';
  return `<div class="detail">
    <div class="dbox"><h3>延迟</h3>
      <div class="drow"><span class="k">🔴 TCP</span><span class="v" style="color:${latColor}">${n.online?n.latency_ms+' ms':'超时'}</span></div>${segs(latFill,latColor)}
      <div class="drow"><span class="k">🟢 ICMP</span><span class="v" style="color:#64748b">未测</span></div>${segs(0,'#94a3b8')}
      <div class="drow"><span class="k">🔵 HTTP</span><span class="v" style="color:#64748b">不适用</span></div>${segs(0,'#94a3b8')}
    </div>
    <div class="dbox"><h3>丢包</h3>
      <div class="drow"><span class="k">🔴 TCP</span><span class="v" style="color:${lossColor}">${esc(n.loss)}%</span></div>${segs(lossFill,lossColor)}
      <div class="drow"><span class="k">🟢 ICMP</span><span class="v" style="color:#64748b">未测</span></div>${segs(0,'#94a3b8')}
      <div class="drow"><span class="k">🔵 HTTP</span><span class="v" style="color:#64748b">不适用</span></div>${segs(0,'#94a3b8')}
    </div>
  </div>`;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const only=curOnly;
  const sort=curSort;
  let list=data.nodes.filter(n=>
    (!q||n.name.toLowerCase().includes(q)) &&
    (!curSrc||n.source===curSrc) &&
    (!only||(only==='online'?n.online:!n.online))
  );
  if(sort==='name') list=[...list].sort((a,b)=>nameKey(a.name).localeCompare(nameKey(b.name),'zh',{numeric:true}));
function nameKey(n){return n.replace(/^[\u{1F1E6}-\u{1F1FF}]+/u,'').trim();}
  document.getElementById('list').innerHTML=list.length?list.map(n=>{
    const c=cls(n.latency_ms,n.online);
    const pct=n.online?Math.min(100,Math.max(4,(n.latency_ms||0)/500*100)):0;
    return `<div class="card${n.online?'':' off'}" onclick="this.querySelector('.detail').classList.toggle('open')">
      <div class="top"><div class="name"><span class="dot" style="background:${barColor(n.latency_ms,n.online)}"></span>${esc(n.name)}</div>
      <div class="lat ${c}">${n.online?n.latency_ms+' <small>ms</small>':'离线'}</div></div>
      <div class="meta"><span class="pill">${esc(n.source)}</span> <span class="proto">${esc(n.proto.toUpperCase())}</span> · <span class="loss">丢包 ${esc(n.loss)}%</span> · <span class="${!n.online?'st-off':n.latency_ms<200?'st-on':n.latency_ms<400?'st-mid':'st-bad'}">${n.online?'在线':'离线'}</span> <span class="bar-inline"><i style="width:${pct}%;background:${barColor(n.latency_ms,n.online)}"></i></span></div>
      ${detailHtml(n)}
    </div>`;
  }).join(''):'<div class="empty">没有匹配的节点，先等第一次探测跑完。</div>';
}
load();
</script>
</body>
</html>
