<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点延迟看板</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0f1e;color:#e2e8f0}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 14px 48px}
  header{padding:8px 2px 16px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stat{background:linear-gradient(180deg,#141d33,#0f172a);border:1px solid #1e293b;border-radius:14px;padding:14px}
  .stat b{font-size:24px;display:block}
  .stat span{font-size:12px;color:#94a3b8}
  .stat small{font-size:12px;color:#94a3b8}
  .bar-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
  .chip{border:1px solid #334155;background:#111c33;color:#e2e8f0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
  .chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
  input,select{background:#111c33;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font-size:14px}
  input{flex:1;min-width:160px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  .card{background:#111c33;border:1px solid #1e293b;border-radius:14px;padding:14px}
  .card.off{opacity:.65}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-weight:700;font-size:15px}
  .meta{color:#94a3b8;font-size:12px;margin-top:4px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;white-space:nowrap}
  .lat{font-size:22px;font-weight:800;white-space:nowrap;text-align:right}
  .lat small{font-size:12px;font-weight:400;color:#94a3b8;display:block}
  .good{color:#4ade80}.mid{color:#facc15}.bad{color:#f87171}.off{color:#94a3b8}
  .bar{height:8px;border-radius:999px;background:#1e293b;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px}
  .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#94a3b8}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .empty{color:#94a3b8;padding:28px;text-align:center;grid-column:1/-1}
  .theme{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .theme button{border:1px solid #334155;background:#111c33;color:#e2e8f0;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .theme button.on{background:#2563eb;border-color:#2563eb;color:#fff}
  body.light{background:#ffffff;color:#0f172a}
  body.light .sub,body.light .stat span{color:#64748b}
  body.light .stat{background:#f8fafc;border-color:#e2e8f0}
  body.light .chip,body.light input,body.light select,body.light .card{background:#ffffff;color:#0f172a;border-color:#e2e8f0}
  body.light .theme button{background:#f8fafc;color:#0f172a;border-color:#e2e8f0}
  body.light .meta{color:#64748b}
  body.light .bar{background:#e2e8f0}
  body.light .pill{background:#f1f5f9;color:#334155}
  body.light .card.off{opacity:.6}
  body.black{background:#000000;color:#e2e8f0}
  body.black .stat,body.black .chip,body.black input,body.black select,body.black .card{background:#111111;border-color:#222222}
  body.black .theme button{background:#111111;border-color:#333333}
  body.black .bar{background:#222222}
  body.black .pill{background:#222222}
  .card{cursor:pointer}
  .detail{display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:10px}
  .detail.open{display:grid}
  .dbox{background:#f1f5f9;color:#0f172a;border-radius:12px;padding:12px}
  .dbox h3{margin:0 0 8px;font-size:14px;color:#334155}
  .drow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
  .drow .k{color:#334155}
  .drow .v{font-weight:700}
  .segs{display:flex;gap:2px;margin:2px 0 6px}
  .segs i{flex:1;height:6px;border-radius:2px;background:#e2e8f0}
  .hint{font-size:12px;color:#94a3b8;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>节点延迟看板</h1>
    <div class="sub" id="updated">正在加载…</div>
    <div class="theme" id="themeBtns">
      <button data-theme="dark" onclick="setTheme('dark')">🌙 深蓝</button>
      <button data-theme="light" onclick="setTheme('light')">☀️ 白色</button>
      <button data-theme="black" onclick="setTheme('black')">⬛ 纯黑</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="total">-</b><span>全部节点</span></div>
      <div class="stat"><b id="online" style="color:#4ade80">-</b><span>在线节点</span></div>
      <div class="stat"><b id="offline" style="color:#94a3b8">-</b><span>离线节点</span></div>
      <div class="stat"><b id="avail">-</b><span>可用率</span></div>
    </div>
  </header>

  <div class="bar-top" id="srcTabs"></div>
  <div class="bar-top">
    <input id="q" placeholder="搜索节点名 / 地区…" oninput="render()">
    <select id="only" onchange="render()">
      <option value="">全部状态</option>
      <option value="online">仅在线</option>
      <option value="offline">仅离线</option>
    </select>
    <select id="sort" onchange="render()">
      <option value="lat">按延迟从低到高</option>
      <option value="name">按名称排序</option>
    </select>
  </div>

  <div class="grid" id="list"></div>
  <p class="sub" style="margin-top:14px">每小时自动测一次 · 延迟为 GitHub 机房到节点的 TCP 延迟，仅供参考 · 点一张卡片可以展开看延迟和丢包详情（只有 TCP 是实测的，ICMP、HTTP 没测）· 离线多为 Hysteria2（UDP），不一定是真死</p>
</div>
<script>
let data={nodes:[]};
let curSrc='';
function setTheme(t){
  document.body.classList.remove('light','black');
  if(t==='light') document.body.classList.add('light');
  if(t==='black') document.body.classList.add('black');
  try{localStorage.setItem('theme',t);}catch(e){}
  document.querySelectorAll('#themeBtns button').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));
}
(function(){try{setTheme(localStorage.getItem('theme')||'dark');}catch(e){setTheme('dark');}})();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const r=await fetch('results.json?'+Date.now());
  data=await r.json();
  document.getElementById('updated').textContent='更新时间：'+data.updated_at+'（每小时自动测一次）';
  document.getElementById('total').textContent=data.total;
  document.getElementById('online').textContent=data.online;
  document.getElementById('offline').textContent=data.offline;
  document.getElementById('avail').textContent=data.total?Math.round(data.online/data.total*100)+'%':'-';
  const srcs=[...new Set(data.nodes.map(n=>n.source).filter(Boolean))];
  document.getElementById('srcTabs').innerHTML='<button class="chip'+(curSrc===''?' on':'')+'" onclick="setSrc(\'\')">全部机场</button>'+srcs.map(s=>`<button class="chip${curSrc===s?' on':''}" onclick="setSrc('${esc(s)}')">${esc(s)}</button>`).join('');
  render();
}
function setSrc(s){curSrc=s;load();}
function cls(ms,online){
  if(!online) return 'off';
  if(ms<150) return 'good'; if(ms<350) return 'mid'; return 'bad';
}
function barColor(ms,online){
  if(!online) return '#475569';
  if(ms<150) return '#22c55e'; if(ms<350) return '#eab308'; return '#ef4444';
}
function segs(filled,color){
  let s='';
  for(let i=0;i<20;i++) s+=`<i style="${i<filled?`background:${color}`:''}"></i>`;
  return `<div class="segs">${s}</div>`;
}
function detailHtml(n){
  const c=cls(n.latency_ms,n.online);
  const latColor=n.online?(n.latency_ms<150?'#16a34a':n.latency_ms<350?'#ca8a04':'#dc2626'):'#dc2626';
  const latFill=n.online?Math.min(20,Math.max(1,Math.round((n.latency_ms||0)/500*20))):20;
  const lossFill=Math.round((n.loss||0)/100*20);
  const lossColor=n.loss===0?'#16a34a':n.loss<50?'#ca8a04':'#dc2626';
  return `<div class="detail">
    <div class="dbox"><h3>延迟</h3>
      <div class="drow"><span class="k">🔴 TCP</span><span class="v" style="color:${latColor}">${n.online?n.latency_ms+' ms':'超时'}</span></div>${segs(latFill,latColor)}
      <div class="drow"><span class="k">🟢 ICMP</span><span class="v" style="color:#64748b">未测</span></div>${segs(0,'#94a3b8')}
      <div class="drow"><span class="k">🔵 HTTP</span><span class="v" style="color:#64748b">不适用</span></div>${segs(0,'#94a3b8')}
    </div>
    <div class="dbox"><h3>丢包</h3>
      <div class="drow"><span class="k">🔴 TCP</span><span class="v" style="color:${lossColor}">${esc(n.loss)}%</span></div>${segs(lossFill,lossColor)}
      <div class="drow"><span class="k">🟢 ICMP</span><span class="v" style="color:#64748b">未测</span></div>${segs(0,'#94a3b8')}
      <div class="drow"><span class="k">🔵 HTTP</span><span class="v" style="color:#64748b">不适用</span></div>${segs(0,'#94a3b8')}
    </div>
  </div>`;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const only=document.getElementById('only').value;
  const sort=document.getElementById('sort').value;
  let list=data.nodes.filter(n=>
    (!q||n.name.toLowerCase().includes(q)) &&
    (!curSrc||n.source===curSrc) &&
    (!only||(only==='online'?n.online:!n.online))
  );
  if(sort==='name') list=[...list].sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  document.getElementById('list').innerHTML=list.length?list.map(n=>{
    const c=cls(n.latency_ms,n.online);
    const pct=n.online?Math.min(100,Math.max(4,(n.latency_ms||0)/500*100)):0;
    return `<div class="card${n.online?'':' off'}" onclick="this.querySelector('.detail').classList.toggle('open')">
      <div class="top"><div><div class="name"><span class="dot" style="background:${barColor(n.latency_ms,n.online)}"></span>${esc(n.name)}</div>
      <div class="meta"><span class="pill">${esc(n.source)}</span> ${esc(n.proto.toUpperCase())} · ${esc(n.host)}:${esc(n.port)}</div></div>
      <div class="lat ${c}">${n.online?n.latency_ms+'<small>ms</small>':'离线'}</div></div>
      <div class="bar"><i style="width:${pct}%;background:${barColor(n.latency_ms,n.online)}"></i></div>
      <div class="foot"><span>丢包 ${esc(n.loss)}%</span><span>${n.online?'在线':'离线'} · 点我看详情</span></div>
      ${detailHtml(n)}
    </div>`;
  }).join(''):'<div class="empty">没有匹配的节点，先等第一次探测跑完。</div>';
}
load();
</script>
</body>
</html>
