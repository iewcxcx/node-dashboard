<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点延迟看板</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0}
  header{padding:20px 16px 8px;max-width:900px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px} p{color:#94a3b8;margin:4px 0}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  .stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 14px}
  .stat b{font-size:20px;display:block}
  .controls{max-width:900px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap}
  input,select{flex:1;min-width:140px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px}
  main{max-width:900px;margin:0 auto;padding:0 16px 40px;display:grid;gap:10px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .name{font-weight:600} .meta{color:#94a3b8;font-size:13px;margin-top:4px}
  .lat{font-size:20px;font-weight:700;white-space:nowrap}
  .good{color:#4ade80}.mid{color:#facc15}.bad{color:#f87171}.off{color:#94a3b8}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;background:#334155}
</style>
</head>
<body>
<header>
  <h1>节点延迟看板</h1>
  <p id="updated">正在加载…</p>
  <div class="stats">
    <div class="stat"><b id="total">-</b>全部节点</div>
    <div class="stat"><b id="online">-</b>在线</div>
    <div class="stat"><b id="offline">-</b>离线</div>
  </div>
</header>
<div class="controls">
  <input id="q" placeholder="搜索节点名 / 地区…" oninput="render()">
  <select id="src" onchange="render()"><option value="">全部机场</option></select>
  <select id="only" onchange="render()">
    <option value="">全部状态</option><option value="online">只看在线</option><option value="offline">只看离线</option>
  </select>
</div>
<main id="list"></main>
<script>
let data={nodes:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const r=await fetch('results.json?'+Date.now());
  data=await r.json();
  document.getElementById('updated').textContent='更新时间：'+data.updated_at+'（每小时自动测一次）';
  document.getElementById('total').textContent=data.total;
  document.getElementById('online').textContent=data.online;
  document.getElementById('offline').textContent=data.offline;
  const srcs=[...new Set(data.nodes.map(n=>n.source))];
  document.getElementById('src').innerHTML='<option value="">全部机场</option>'+srcs.map(s=>`<option>${s}</option>`).join('');
  render();
}
function cls(ms,online){
  if(!online) return 'off';
  if(ms<150) return 'good'; if(ms<350) return 'mid'; return 'bad';
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const src=document.getElementById('src').value;
  const only=document.getElementById('only').value;
  const list=data.nodes.filter(n=>
    (!q||n.name.toLowerCase().includes(q)) &&
    (!src||n.source===src) &&
    (!only||(only==='online'?n.online:!n.online))
  );
  document.getElementById('list').innerHTML=list.length?list.map(n=>`
    <div class="card"><div><div class="name">${esc(n.name)}</div>
    <div class="meta"><span class="pill">${esc(n.source)}</span> ${esc(n.proto.toUpperCase())} · ${esc(n.host)}:${esc(n.port)} · 丢包 ${esc(n.loss)}%</div></div>
    <div class="lat ${cls(n.latency_ms,n.online)}">${n.online?n.latency_ms+' ms':'离线'}</div></div>`).join('')
    :'<p style="color:#94a3b8">没有匹配的节点，先等第一次探测跑完。</p>';
}
load();
</script>
</body>
</html>
